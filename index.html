<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Layang & Undangan Aksara Jawa</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Pustaka PDF html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Aplikasi Layang & Undangan Aksara Jawa</h1>
      <p>Nyerat serat lan undangan mawi Aksara Jawa kanthi gampang</p>
    </header>

    <!-- FORM INPUT -->
    <section id="formSection" class="card">
      <h2>Isi Formulir Dokumen</h2>
      <form id="docForm">
        
        <div class="form-group">
          <label for="docType">1. Jenis Dokumen:</label>
          <select id="docType" onchange="toggleDocTypeFields()">
            <option value="undangan">Undangan</option>
            <option value="surat">Surat</option>
          </select>
        </div>

        <div class="form-group">
          <label for="docLang">2. Bahasa:</label>
          <select id="docLang" onchange="updateEngineOptions()">
            <option value="indonesia">Bahasa Indonesia</option>
            <option value="jawa">Bahasa Jawa</option>
          </select>
        </div>

        <!-- Dropdown Paugeran (Nama Font Dihapus) -->
        <div class="form-group" id="engineGroup" style="display: none;">
          <label for="docEngine">3. Pedoman Tata Tulis Aksara Jawa:</label>
          <select id="docEngine">
            <option value="kbj.js">Paugeran KBJ</option>
            <option value="sriwedari.js">Paugeran Sriwedari 1926</option>
            <option value="simplified.js">Paugeran Modern / Simplified</option>
            <option value="tradisional.js">Ejaan Tradisional</option>
            <option value="carakawi.js">Cara Kawi / Mardi Kawi</option>
          </select>
        </div>

        <hr>

        <div class="form-row">
          <div class="form-group half">
            <label for="inputKota">Kota Asal Surat:</label>
            <input type="text" id="inputKota" placeholder="Contoh: Yogyakarta" required>
          </div>
          <div class="form-group half">
            <label for="inputTanggalSurat">Tanggal Surat:</label>
            <input type="date" id="inputTanggalSurat" required>
          </div>
        </div>

        <div class="form-group">
          <label for="inputPenerima">Penerima (Nama Person/Lembaga):</label>
          <input type="text" id="inputPenerima" placeholder="Contoh: Raden Mas Danang" required>
        </div>

        <!-- Detail Undangan -->
        <div id="undanganFields">
          <h3>Detail Acara Undangan</h3>
          <div class="form-row">
            <div class="form-group half">
              <label for="inputTanggalAcara">Hari, Tanggal Acara:</label>
              <input type="date" id="inputTanggalAcara">
            </div>
            <div class="form-group half">
              <label for="inputJamAcara">Jam / Waktu:</label>
              <input type="text" id="inputJamAcara" placeholder="Contoh: 09.00 WIB - Selesai">
            </div>
          </div>
          <div class="form-group">
            <label for="inputTempatAcara">Tempat:</label>
            <input type="text" id="inputTempatAcara" placeholder="Contoh: Pendopo Kabupaten Bantul">
          </div>
          <div class="form-group">
            <label for="inputNamaAcara">Nama Acara:</label>
            <input type="text" id="inputNamaAcara" placeholder="Contoh: Pahargyan Temanten">
          </div>
        </div>

        <!-- Detail Surat -->
        <div id="suratFields" style="display: none;">
          <h3>Isi Surat</h3>
          <div class="form-group">
            <label for="inputIsiSurat">Tuliskan Isi Surat (Huruf Latin):</label>
            <textarea id="inputIsiSurat" rows="6" placeholder="Tuliskan isi surat lengkap di sini..."></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="inputPengirim">Pengirim (Nama Terang):</label>
          <input type="text" id="inputPengirim" placeholder="Contoh: Ki Hajar Dewantara" required>
        </div>

        <button type="submit" class="btn primary">Proses & Lihat Preview</button>
      </form>
    </section>

    <!-- PREVIEW SECTION -->
    <section id="previewSection" class="card" style="display: none;">
      <h2>Preview Aksara Jawa (Format A4)</h2>
      
      <div id="pdfContainer" class="a4-page">
        <div class="pdf-header">
          <span id="previewKotaTanggal"></span>
        </div>

        <div class="pdf-recipient">
          <p id="previewTujuanLabel"></p>
          <p id="previewPenerimaNama" class="indented"></p>
        </div>

        <div class="pdf-body">
          <p id="previewPengantar" class="paragraph-text"></p>

          <div id="previewDetailAcara" class="event-details" style="display: none;">
            <table>
              <tr>
                <td class="label-col" id="lblHariTanggal">Hari, Tanggal</td>
                <td>: <span id="previewHariTanggal"></span></td>
              </tr>
              <tr>
                <td class="label-col" id="lblJam">Jam</td>
                <td>: <span id="previewJam"></span></td>
              </tr>
              <tr>
                <td class="label-col" id="lblTempat">Tempat</td>
                <td>: <span id="previewTempat"></span></td>
              </tr>
              <tr>
                <td class="label-col" id="lblAcara">Acara</td>
                <td>: <span id="previewNamaAcara"></span></td>
              </tr>
            </table>
          </div>

          <p id="previewIsiSuratText" class="paragraph-text" style="display: none;"></p>
          <p id="previewPenutup" class="paragraph-text"></p>
        </div>

        <div class="pdf-footer">
          <p id="previewPengirimLabel"></p>
          <br><br><br>
          <p id="previewPengirimNama" class="bold-text"></p>
        </div>
      </div>

      <div class="action-buttons" id="previewActions">
        <button type="button" onclick="editForm()" class="btn secondary">Edit Data</button>
        <button type="button" onclick="downloadPDF()" class="btn success">Download PDF</button>
      </div>

      <div class="post-download-menu" id="postDownloadMenu" style="display: none;">
        <p class="success-msg">✓ Dokumen PDF Berhasil Diunduh!</p>
        <button type="button" onclick="resetForm()" class="btn primary">Tulis Lagi</button>
        <a href="https://www.kandangjagojawa.github.io" class="btn danger">Keluar</a>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
